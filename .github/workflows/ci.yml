name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests with test ROMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: test-roms
          key: test-roms-${{ hashFiles('scripts/fetch-test-roms.sh') }}
      - run: ./scripts/fetch-test-roms.sh
      - run: cargo test --workspace
        env:
          # Fail instead of skipping if a ROM went missing.
          DOTMATRIX_REQUIRE_TEST_ROMS: "1"

  wasm:
    name: wasm build and browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-web.sh
      - name: The module must not import anything
        run: |
          node -e "const m = new WebAssembly.Module(require('fs').readFileSync('web/dotmatrix.wasm'));
                   const i = WebAssembly.Module.imports(m);
                   if (i.length) { console.error(i); process.exit(1); }"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # GitHub's Ubuntu runners ship Google Chrome, which Playwright drives
      # through channel "chrome".
      - run: npm run smoke
